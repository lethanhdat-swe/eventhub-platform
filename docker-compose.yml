services:
    mysql:
        image: mysql:8.0
        container_name: eventhub-mysql
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: event_hub
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
        ports:
            - "127.0.0.1:3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        command: --default-authentication-plugin=mysql_native_password

    backend:
        build:
            context: ./server
        container_name: eventhub-backend
        restart: unless-stopped
        env_file:
            - ./server/.env.production
        ports:
            - "8000:8000"
        volumes:
            - eventhub_uploads:/app/uploads
        depends_on:
            - mysql

    queue:
        build:
            context: ./server
        container_name: eventhub-queue
        restart: unless-stopped
        command: npm run start:queue
        env_file:
            - ./server/.env.production
        depends_on:
            - mysql
        volumes:
            - eventhub_uploads:/app/uploads

    scheduler:
        build:
            context: ./server
        container_name: eventhub-scheduler
        restart: unless-stopped
        command: npm run start:schedule
        env_file:
            - ./server/.env.production
        depends_on:
            - mysql
        volumes:
            - eventhub_uploads:/app/uploads

    frontend:
        build:
            context: ./client
            args:
                VITE_API_URL: ${VITE_API_URL}
                VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
                VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
                VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
                VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
                VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
                VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
                VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        container_name: eventhub-frontend
        restart: unless-stopped
        ports:
            - "80:80"
        depends_on:
            - backend

volumes:
    mysql_data:
    eventhub_uploads:
